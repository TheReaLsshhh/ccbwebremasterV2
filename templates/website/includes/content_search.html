<form class="content-search" method="get" role="search">
<div class="search-field"><label for="content-query">Search {{ search_label|default:"this page" }}</label><input id="content-query" class="form-control" type="search" name="q" value="{{ request.GET.q }}" placeholder="{{ search_placeholder|default:'Type a keyword...' }}" maxlength="200"></div>
{% if categories %}<div class="search-field"><label for="content-category">Category</label><select id="content-category" class="form-select" name="category"><option value="">All categories</option>{% for value,label in categories %}<option value="{{ value }}" {% if request.GET.category == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>{% endif %}
{% if departments %}<div class="search-field"><label for="content-department">Department</label><select id="content-department" class="form-select" name="department"><option value="">All departments</option>{% for department in departments %}<option {% if request.GET.department == department %}selected{% endif %}>{{ department }}</option>{% endfor %}</select></div>{% endif %}
<button class="btn btn-brand" type="submit">Search</button>{% if request.GET.q or request.GET.category or request.GET.department %}<a class="search-reset" href="{{ request.path }}">Clear filters</a>{% endif %}
</form>
