<!DOCTYPE html>
<html>
<head>
    <title>New Contact Inquiry</title>
</head>
<body style="font-family: sans-serif; color: #333;">
    <p>A new contact inquiry has been submitted on the <strong>{{ settings.site_name }}</strong> website.</p>
    <hr>
    <p><strong>From:</strong> {{ inquiry.name }} &lt;{{ inquiry.email }}&gt;</p>
    <p><strong>Subject:</strong> {{ inquiry.subject }}</p>
    <p><strong>Date:</strong> {{ inquiry.created_at|date:"F j, Y, P" }}</p>
    <p><strong>Message:</strong></p>
    <blockquote style="border-left: 4px solid #ccc; padding-left: 1em; margin-left: 1em;">
        {{ inquiry.message|linebreaksbr }}
    </blockquote>
    <hr>
    <p style="font-size: 0.8em; color: #888;">This is an automated notification.</p>
</body>
</html>
