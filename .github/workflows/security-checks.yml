name: Security and Regression Checks
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade "pip>=26.2.2" pip-audit
      - run: python -m pip_audit -r requirements.txt
  regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEBUG: "True"
      ALLOWED_HOSTS: "testserver,localhost,127.0.0.1"
      DATABASE_URL: "sqlite:///:memory:"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: python -m pip install --upgrade "pip>=26.2.2"
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test website --noinput
      - run: node --test tests/college-motion.test.cjs
