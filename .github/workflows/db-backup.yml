name: Monthly DB Backup

on:
  schedule:
    # Run on the 1st of every month at 2:00 AM UTC
    - cron: "0 2 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    name: PostgreSQL Backup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run pg_dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          : "${DATABASE_URL:?Configure the database backup secret}"
          TIMESTAMP=$(date -u +%Y-%m-%d_%H%M%S)
          export FILENAME="ccb_backup_${TIMESTAMP}.dump"
          docker run --rm \
            -v "${{ github.workspace }}:/backup" \
            -e DATABASE_URL -e FILENAME \
            postgres:18 \
            sh -ec 'pg_dump --dbname="$DATABASE_URL" --format=custom --no-owner --no-privileges --file="/backup/$FILENAME"'
          test -s "$FILENAME"
          echo "FILENAME=${FILENAME}" >> "$GITHUB_ENV"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: ${{ env.FILENAME }}
          retention-days: 90
          if-no-files-found: error

      - name: Summary
        run: |
          echo "## Database Backup Artifact Created" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **File:** \`${{ env.FILENAME }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Retention:** 90 days" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Download from: Actions > This workflow run > Artifacts" >> "$GITHUB_STEP_SUMMARY"
